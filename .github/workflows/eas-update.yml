name: 🚀 EAS update

env:
  EXPO_PUBLIC_BASE_URL: ${{ vars.API_URL }}
  EXPO_PUBLIC_AUTH_URL: ${{ vars.AUTH_URL }}
  EXPO_PUBLIC_OPENAPI_URL: ${{ vars.OPENAPI_URL }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel (matches build profile)
        required: true
        default: production
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Matches eas.json build profile env and app.config.ts APP_ENV.
      APP_ENV: ${{ github.event.inputs.channel }}
      # EAS server environments: development | preview | production (staging channel → preview).
      EAS_ENVIRONMENT: ${{ github.event.inputs.channel == 'production' && 'production' || (github.event.inputs.channel == 'staging' && 'preview' || 'development') }}
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5

      - name: 🏗 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🏗 Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Publish update
        run: >-
          eas update
          --branch "${{ github.event.inputs.channel }}"
          --environment "$EAS_ENVIRONMENT"
          --message "Manual update to ${{ github.event.inputs.channel }} (${{ github.sha }})"
          --non-interactive
